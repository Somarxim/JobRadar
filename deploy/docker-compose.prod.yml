# JobRadar 生产部署（Docker Compose）
# 用法：docker compose -f deploy/docker-compose.prod.yml up -d
#
# 适用场景：自有服务器、轻量云（阿里云/腾讯云/AWS Lightsail 等）。
# 若用 Render/Railway/Fly.io 等 PaaS，它们自带 PostgreSQL，只需 Dockerfile 即可。

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobradar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d jobradar"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 生产不暴露端口到宿主机，仅后端服务通过内部网络访问
    # 若需外接 psql 调试，临时加 ports: - "127.0.0.1:5432:5432"

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jobradar-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 网络：容器内通过服务名 db 访问 PostgreSQL
      DB_URL: jdbc:postgresql://db:5432/jobradar
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      # 安全：生产必须修改！
      JOBRADAR_LOCAL_TOKEN: ${JOBRADAR_LOCAL_TOKEN:?err JOBRADAR_LOCAL_TOKEN is required}
      JOBRADAR_PASSWORD: ${JOBRADAR_PASSWORD:?err JOBRADAR_PASSWORD is required}
      JOBRADAR_AUTH_ENABLED: "true"
      # HTTPS 反代（Caddy）下 Cookie 只走加密通道
      SESSION_COOKIE_SECURE: "true"
      # CORS：前端域名（Vercel 部署后把域名填这里）
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # LLM（从环境变量注入，不硬编码）
      DeepSeek_API_KEY: ${DeepSeek_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LLM_DAILY_TOKEN_LIMIT: ${LLM_DAILY_TOKEN_LIMIT:-200000}
      # 文件存储（挂卷持久化）
      JOBRADAR_RESUME_DIR: /data/resumes
      # 监听 0.0.0.0（容器内必须暴露给外部）
      SERVER_ADDRESS: 0.0.0.0
      # JVM 上限：防止小内存机器 OOM（2C4G 服务器留足系统与 DB 余量）
      JAVA_OPTS: -Xmx768m
    ports:
      # 只绑回环：外部流量一律走 Caddy(443) 反代，8080 不直接暴露公网
      - "127.0.0.1:8080:8080"
    volumes:
      - resumes:/data/resumes
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  resumes:
