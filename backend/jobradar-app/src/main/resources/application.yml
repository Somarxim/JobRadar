server:
  port: 8080
  # 仅监听回环地址：本地单用户应用，不暴露到局域网（architecture.md §6）
  address: 127.0.0.1

spring:
  application:
    name: jobradar-app

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # validate：schema 的唯一事实来源是 Flyway 迁移脚本，Hibernate 只做校验不做变更。
      # 教学点：生产项目绝不用 create/update——实体改动与库表漂移会失控。
      ddl-auto: validate
    # 关闭 OSIV：强制在 Service 事务边界内完成懒加载，避免"View 层隐式挂数据库连接"
    # 这一经典性能陷阱（N+1 与连接耗尽的常见根因，面试高频）。
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    # 迁移脚本在 jobradar-core（schema 与实体同模块），app 经依赖传递拿到
    locations: classpath:db/migration

  servlet:
    multipart:
      # 简历 PDF 上传上限 10MB（Spring 默认仅 1MB，简历普遍 1-5MB 会被误拒）
      max-file-size: 10MB
      max-request-size: 11MB

  ai:
    model:
      # 模型全部由 LlmConfig 显式构造（多供应商路由、key 缺省降级），
      # starter 自带的 chat/embedding/image/audio 自动装配一律关闭——
      # 它们会在 spring.ai.openai.api-key 缺失时直接启动失败。
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

  jackson:
    default-property-inclusion: non_null
    # API 契约统一 snake_case（api-design.md），全局策略免去逐字段 @JsonProperty
    property-naming-strategy: SNAKE_CASE
    mapper:
      # 契约里枚举是小写（"applied"），宽容反序列化为 Java 大写常量（APPLIED）
      accept-case-insensitive-enums: true

# 应用自定义配置段（@ConfigurationProperties 在后续提交中绑定）
jobradar:
  security:
    # Chrome 插件调用本地 API 的校验令牌（防其他网页恶意 POST），见 api-design.md §3
    local-token: ${JOBRADAR_LOCAL_TOKEN:dev-only-token-change-me}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  # LLM 模型路由（agent-design.md §1.2）：OpenAI 兼容协议，换 base-url 即换供应商。
  # key 从环境变量注入（密钥不入库不进 git）；为空则该能力降级（ingest 回到 hints 必填）。
  llm:
    # 每日 token 成本闸：超闸后所有 LLM 任务拒发并记失败账（防刷/防失控；置空不限）
    daily-token-limit: ${LLM_DAILY_TOKEN_LIMIT:200000}
    parse:                       # JD 文本结构化：DeepSeek（中文好、便宜）
      base-url: https://api.deepseek.com
      api-key: ${DeepSeek_API_KEY:}
      model: deepseek-chat
    vision:                      # 海报图片多模态：阿里 DashScope qwen-vl（W2 后续切片接入）
      base-url: https://dashscope.aliyuncs.com/compatible-mode   # Spring AI 会自动拼 /v1/chat/completions，勿带 /v1
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen-vl-plus
  # 本地文件存储：简历 PDF 原件目录（~ 展开由 ResumeService 处理）
  storage:
    resume-dir: ${JOBRADAR_RESUME_DIR:~/.jobradar/resumes}
  # W3 爬虫调度：每日一轮抓取启用中的 crawl_sources；enabled=false 可整体关停
  crawler:
    enabled: ${CRAWLER_ENABLED:true}
    cron: ${CRAWLER_CRON:0 30 7 * * *}
  # W3 每日推荐调度：排在爬虫批次之后（默认 07:45），LLM 不可用时自动降级规则粗排
  recommend:
    enabled: ${RECOMMEND_ENABLED:true}
    cron: ${RECOMMEND_CRON:0 45 7 * * *}
